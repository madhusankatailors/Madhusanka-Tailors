<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #0f1115;
            --card: rgba(255, 255, 255, 0.06);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f5f7fb;
            --muted: #b8c0d1;
            --gold: #d8b36a;
            --gold-strong: #f2cf87;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            --radius-xl: 28px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(216, 179, 106, 0.2), transparent 28%),
                radial-gradient(circle at top right, rgba(96, 123, 255, 0.14), transparent 18%),
                linear-gradient(180deg, #0f1115 0%, #0b0d11 100%);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button {
            font: inherit;
        }

        .container {
            width: min(calc(100% - 32px), 1200px);
            margin: 0 auto;
            padding: 28px 0 42px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            color: var(--gold-strong);
            font-weight: 700;
        }

        .page-shell,
        .thumb-card {
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
        }

        .page-shell {
            border-radius: var(--radius-xl);
            padding: 22px;
            overflow: hidden;
        }

        .eyebrow {
            color: var(--gold-strong);
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-size: 12px;
            margin-bottom: 10px;
        }

        h1,
        h2 {
            margin: 0;
            font-family: "Playfair Display", serif;
            line-height: 1.1;
        }

        h1 {
            font-size: clamp(2.1rem, 4vw, 3.2rem);
            margin-bottom: 10px;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.75;
            font-size: 15px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 20px;
            align-items: stretch;
            margin-bottom: 24px;
        }

        .hero-copy {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            padding: 10px 4px;
        }

        .note {
            display: inline-flex;
            align-self: flex-start;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(216, 179, 106, 0.1);
            border: 1px solid rgba(216, 179, 106, 0.18);
            color: var(--gold-strong);
            font-size: 12px;
            font-weight: 700;
        }

        .hero-image {
            min-height: 380px;
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #11161d;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: end;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .mini-help {
            color: var(--muted);
            font-size: 13px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            auto-rows: 280px;
        }

        .thumb-card {
            border-radius: var(--radius-lg);
            padding: 0;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .thumb-card:hover,
        .thumb-card.active {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(216, 179, 106, 0.3);
            box-shadow: 0 20px 50px rgba(216, 179, 106, 0.2), 0 0 20px rgba(216, 179, 106, 0.1);
        }

        .thumb-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1;
            border-radius: var(--radius-lg);
        }

        .thumb-card:hover::before {
            opacity: 0.5;
        }

        .thumb-card:nth-child(1) {
            animation: slideInUp 0.6s ease-out 0.1s both;
        }

        .thumb-card:nth-child(2) {
            animation: slideInUp 0.6s ease-out 0.2s both;
        }

        .thumb-card:nth-child(3) {
            animation: slideInUp 0.6s ease-out 0.3s both;
        }

        .thumb-card:nth-child(4) {
            animation: slideInUp 0.6s ease-out 0.4s both;
        }

        .thumb-card:nth-child(5) {
            animation: slideInUp 0.6s ease-out 0.5s both;
        }

        .thumb-card:nth-child(6) {
            animation: slideInUp 0.6s ease-out 0.6s both;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .thumb-media {
            height: 100%;
            width: 100%;
            overflow: hidden;
            border-radius: var(--radius-lg);
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .thumb-media img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .thumb-card:hover .thumb-media img {
            transform: scale(1.08);
        }

        .thumb-card h3 {
            display: none;
        }

        .thumb-card p {
            display: none;
        }

        @media (max-width: 980px) {

            .hero-grid,
            .photo-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 720px) {

            .hero-grid,
            .photo-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        function placeholderSvg(label) {
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#1b212b" />
              <stop offset="100%" stop-color="#0f1115" />
            </linearGradient>
          </defs>
          <rect width="1200" height="900" fill="url(#g)" />
          <rect x="50" y="50" width="1100" height="800" rx="30" fill="none" stroke="#d8b36a" stroke-opacity="0.55" stroke-dasharray="14 10" />
          <text x="50%" y="46%" fill="#f5f7fb" font-size="54" font-family="Arial, sans-serif" text-anchor="middle">${label}</text>
          <text x="50%" y="54%" fill="#d8b36a" font-size="28" font-family="Arial, sans-serif" text-anchor="middle">Image preview unavailable</text>
        </svg>
      `)}`;
        }

        const params = new URLSearchParams(window.location.search);
        const collectionKey = params.get('collection') || 'bridal-party';
        const selectedCollection = galleryCollections[collectionKey] || galleryCollections['bridal-party'];
        const galleryPhotos = selectedCollection.photos;
        const focusIndex = Math.max(0, Math.min(galleryPhotos.length - 1, Number(params.get('focus') || 0)));

        const mainPhoto = document.getElementById('mainPhoto');
        const mainTitle = document.getElementById('mainTitle');
        const mainDesc = document.getElementById('mainDesc');
        const photoGrid = document.getElementById('photoGrid');
        const note = document.querySelector('.note');
        const gridHeading = document.querySelector('.section-title h2');
        const miniHelp = document.querySelector('.mini-help');

        function applyFallback(img, label) {
            const fallback = placeholderSvg(label);
            img.addEventListener('error', () => {
                img.src = fallback;
            }, { once: true });
        }

        function setActive(index) {
            const item = galleryPhotos[index] || galleryPhotos[0];
            mainPhoto.src = item.image;
            mainPhoto.alt = item.title;
            mainTitle.textContent = item.title;
            mainDesc.textContent = item.desc;
            applyFallback(mainPhoto, item.title);

            [...photoGrid.children].forEach((card, cardIndex) => {
                card.classList.toggle('active', cardIndex === index);
            });
        }

        if (note) {
            note.textContent = selectedCollection.title;
        }

        if (gridHeading) {
            gridHeading.textContent = `${selectedCollection.title} Gallery`;
        }

        if (miniHelp) {
            miniHelp.textContent = selectedCollection.help || "Select a photo below to view more from this collection.";
        }

        photoGrid.innerHTML = galleryPhotos.map((item, index) => `
      <button class="thumb-card" type="button" data-index="${index}" aria-label="Show ${item.title}">
        <div class="thumb-media">
          <img src="${item.image}" alt="${item.title}" loading="lazy" />
        </div>
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
      </button>
    `).join('');

        photoGrid.querySelectorAll('img').forEach((img) => {
            applyFallback(img, img.alt || 'Gallery Photo');
        });

        photoGrid.querySelectorAll('.thumb-card').forEach((card) => {
            card.addEventListener('click', () => {
                setActive(Number(card.dataset.index));
                document.querySelector('.hero-image').scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        });

        setActive(focusIndex);
